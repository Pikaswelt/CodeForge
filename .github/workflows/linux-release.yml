name: Linux release

# Builds the Linux packages (AppImage + .deb) for every published release and
# attaches them together with latest-linux.yml, which the in-app updater reads.
# Windows installers are built locally and uploaded when the release is created.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v2.6.3
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Repository that receives the published assets. Keep this public: release assets of
      # a private repository cannot be downloaded without a token, and the app's updater
      # fetches them anonymously. Override with the repository variable RELEASE_REPO.
      RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # node-pty has no Linux prebuilds; npm ci compiles it (N-API, works with Electron).
      - run: npm ci

      - run: npm run dist:linux

      - name: Ensure release exists
        run: |
          gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$RELEASE_REPO" --title "$TAG" \
                 --notes "Release assets for $TAG (built from $GITHUB_REPOSITORY)."

      - name: Upload to release
        run: |
          gh release upload "$TAG" \
            release/*.AppImage \
            release/*.deb \
            release/latest-linux.yml \
            --repo "$RELEASE_REPO" \
            --clobber
