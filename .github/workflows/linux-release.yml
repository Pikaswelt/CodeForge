name: Linux release

# Builds the Linux packages (AppImage + .deb) for every published release and
# attaches them together with latest-linux.yml, which the in-app updater reads.
# Windows installers are built locally and uploaded when the release is created.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v2.6.3
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # node-pty has no Linux prebuilds; npm ci compiles it (N-API, works with Electron).
      - run: npm ci

      - run: npm run dist:linux

      - name: Upload to release
        run: |
          gh release upload "$TAG" \
            release/*.AppImage \
            release/*.deb \
            release/latest-linux.yml \
            --clobber
