name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z.B. 2.3.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: CodeForge
        run: npm install

      - name: Setup Java (for Android APK Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: TypeScript Check
        working-directory: CodeForge
        run: npm run lint

      - name: Build Vite
        working-directory: CodeForge
        run: npm run build

      - name: Build Android APK (Debug)
        working-directory: CodeForge
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Build Android APK (Release)
        working-directory: CodeForge
        run: |
          cd android && ./gradlew assembleRelease || echo "Release build skipped (keine Signing-Keys)"

      - name: Build Windows EXE
        working-directory: CodeForge
        run: npm run dist:win

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(node -p "require('./CodeForge/package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Collect Release Assets
        run: |
          mkdir -p release-assets
          # Android APKs
          cp CodeForge/android/app/build/outputs/apk/debug/app-debug.apk release-assets/CodeForge-v${{ steps.version.outputs.VERSION }}-android-debug.apk 2>/dev/null || true
          # Windows Setup
          cp CodeForge/release/CodeForge-Setup-${{ steps.version.outputs.VERSION }}.exe release-assets/ 2>/dev/null || true
          # CLI script
          cp CodeForge/codeforge-cli.mjs release-assets/ 2>/dev/null || true
          # Connect scripts
          cp CodeForge/codeforge-connect.sh release-assets/ 2>/dev/null || true
          cp CodeForge/codeforge-connect-debian.sh release-assets/ 2>/dev/null || true
          cp CodeForge/codeforge-connect-windows.ps1 release-assets/ 2>/dev/null || true
          cp CodeForge/codeforge-remote-server.mjs release-assets/ 2>/dev/null || true
          # List assets
          echo "### Release-Assets:" >> $GITHUB_STEP_SUMMARY
          ls -la release-assets/ >> $GITHUB_STEP_SUMMARY

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        with:
          name: "CodeForge v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref || format('v{0}', steps.version.outputs.VERSION) }}
          body: |
            ## ⚔️ CodeForge v${{ steps.version.outputs.VERSION }}

            ### 📱 Neu: Einfacher Kopplungsmodus!
            - `bash codeforge-connect.sh` → Code ablesen → In der App eingeben → **FERTIG!**

            ### 📦 Download
            - **Android APK:** `CodeForge-v${{ steps.version.outputs.VERSION }}-android-debug.apk`
            - **Windows Setup:** `CodeForge-Setup-${{ steps.version.outputs.VERSION }}.exe`
            - **CLI:** `codeforge-cli.mjs`
            - **Server:** `codeforge-remote-server.mjs`

            ### 🚀 Quick Start
            ```bash
            # Auf dem Linux-PC:
            bash codeforge-connect.sh
            
            # Auf dem Debian-VPS:
            sudo bash codeforge-connect-debian.sh
            ```
            
            ### 🔒 Sicherheit
            - Token wird automatisch generiert und nie committed
            - Kopplungscode ist nur 10 Minuten gültig
            - Alle API-Calls benötigen Token-Authentifizierung
          draft: false
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE (bei Push auf main)
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: CodeForge-Windows-Setup
          path: CodeForge/release/CodeForge-Setup-*.exe

      - name: Upload Android APK (bei Push auf main)
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: CodeForge-Android-APK
          path: CodeForge/android/app/build/outputs/apk/debug/app-debug.apk
