name: Android APK

# Builds the Android app (FancyCode Mobile) as an installable APK. Every run uploads it as a
# workflow artifact; for a published release it is attached to the release as well.
#
# Signing: the release key lives only in the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. The old FancyCode key
# (ANDROID_OLD_KEYSTORE_BASE64, ANDROID_OLD_KEYSTORE_PASSWORD) is only used together with
# android/app/signing-lineage.bin, so installed apps accept the new key as an update.
# Without the secrets (pull requests from forks) the APK is signed with a throwaway debug key.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK (ANDROID_HOME) with accepted licenses;
      # Gradle downloads the platform and build tools it needs.
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # Native desktop modules (node-pty, Electron) are not needed for the web build.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx cap sync android

      - name: Use private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OLD_KEYSTORE_BASE64: ${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "FANCYCODE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "FANCYCODE_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "FANCYCODE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "FANCYCODE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          if [ -n "$OLD_KEYSTORE_BASE64" ]; then
            echo "$OLD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/old.keystore"
            echo "OLD_KEYSTORE_FILE=$RUNNER_TEMP/old.keystore" >> "$GITHUB_ENV"
            echo "OLD_KEYSTORE_PASSWORD=${{ secrets.ANDROID_OLD_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign with key rotation
        if: env.OLD_KEYSTORE_FILE != ''
        run: scripts/sign-apk-rotated.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Name APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/FancyCode-Android-$VERSION.apk"
          echo "file=out/FancyCode-Android-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: FancyCode-Android
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          # Same target as the Windows/Linux release jobs: assets must stay publicly
          # downloadable, otherwise the in-app updater cannot reach them.
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$RELEASE_REPO" --title "$TAG" \
                 --notes "Release assets for $TAG (built from $GITHUB_REPOSITORY)."
          gh release upload "$TAG" "${{ steps.apk.outputs.file }}" --repo "$RELEASE_REPO" --clobber
